<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Services | Wise Media Freelance</title>

    <meta name="description"
        content="Explore book publishing, editing, design, trailer creation and marketing services at Wise Media Freelance.">

    <link rel="stylesheet" href="assets/css/styles.css">

    <style>

        /* BOOK SERVICES PAGE */

        .book-hero {
            background: linear-gradient(120deg, #0B1020, #080808);
            padding: 110px 8%;
            color: white;
            text-align: center;
        }

        .book-hero-label {
            color: #D6B46A;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: bold;
        }

        .book-hero h1 {
            font-size: clamp(35px, 5vw, 60px);
            max-width: 900px;
            margin: 25px auto;
            line-height: 1.2;
        }

        .book-hero h1 span {
            color: #D6B46A;
        }

        .book-hero p {
            max-width: 750px;
            margin: auto;
            color: #ddd;
            font-size: 16px;
            line-height: 1.9;
        }

        .book-hero-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        .book-outline-button {
            padding: 14px 25px;
            border: 1px solid #D6B46A;
            color: white;
            text-decoration: none;
            transition: .3s;
        }

        .book-outline-button:hover {
            background: #D6B46A;
            color: #080808;
        }


        /* INTRODUCTION */

        .book-intro {
            padding: 75px 8%;
            text-align: center;
            background: white;
        }

        .book-intro h2 {
            font-size: 35px;
            color: #0B1020;
            margin-bottom: 20px;
        }

        .book-intro p {
            max-width: 750px;
            margin: auto;
            color: #666;
            line-height: 1.9;
        }


        /* SERVICE DIRECTORY */

        .book-directory {
            padding: 75px 8%;
            background: #f5f5f5;
        }

        .book-section-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .book-section-heading span {
            color: #a27a32;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .book-section-heading h2 {
            color: #0B1020;
            font-size: 36px;
            margin-top: 15px;
        }


        /* FILTERS */

        .book-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .book-filter {
            padding: 12px 20px;
            background: white;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: .3s;
        }

        .book-filter.active,
        .book-filter:hover {
            background: #0B1020;
            color: white;
            border-color: #D6B46A;
        }


        /* SERVICE GRID */

        .book-service-grid {
            max-width: 1250px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .book-service-card {
            background: white;
            border-bottom: 4px solid #D6B46A;
            display: flex;
            flex-direction: column;
            transition: .3s;
        }

        .book-service-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
        }

        .book-service-icon {
            height: 175px;
            background: linear-gradient(135deg, #0B1020, #28344d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #D6B46A;
        }

        .book-service-content {
            padding: 27px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .book-service-content .category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a27a32;
            font-weight: bold;
            margin-bottom: 13px;
        }

        .book-service-content h3 {
            color: #0B1020;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .book-service-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 22px;
        }

        .book-service-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .book-service-actions a {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #0B1020;
            color: #0B1020;
            transition: .3s;
        }

        .book-service-actions .primary {
            background: #D6B46A;
            border-color: #D6B46A;
            color: #080808;
        }

        .book-service-actions a:hover {
            background: #0B1020;
            color: white;
        }


        /* EMPTY SEARCH */

        .book-empty {
            display: none;
            text-align: center;
            padding: 40px;
            color: #555;
        }


        /* OTHER AUTHOR SERVICES */

        .other-author-services {
            max-width: 1000px;
            margin: 65px auto 0;
            background: white;
            padding: 30px;
            border-left: 4px solid #D6B46A;
        }

        .other-author-services h3 {
            color: #0B1020;
            margin-bottom: 12px;
        }

        .other-author-services p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .other-author-services button {
            background: transparent;
            border: 1px solid #D6B46A;
            padding: 13px 20px;
            cursor: pointer;
            color: #0B1020;
            font-weight: bold;
        }


        /* CUSTOM PACKAGE */

        .custom-package {
            padding: 90px 8%;
            text-align: center;
            background: #0B1020;
            color: white;
        }

        .custom-package h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .custom-package p {
            max-width: 700px;
            margin: auto auto 30px;
            color: #ddd;
            line-height: 1.8;
        }


        /* RESPONSIVE */

        @media(max-width: 950px) {

            .book-service-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 600px) {

            .book-hero {
                padding: 75px 6%;
            }

            .book-hero h1 {
                font-size: 36px;
            }

            .book-intro,
            .book-directory {
                padding: 60px 6%;
            }

            .book-service-grid {
                grid-template-columns: 1fr;
            }

            .book-filters {
                justify-content: flex-start;
            }

            .book-filter {
                font-size: 12px;
                padding: 10px 13px;
            }

            .book-service-actions a {
                font-size: 10px;
            }

            .custom-package h2 {
                font-size: 29px;
            }

        }

    </style>

</head>
